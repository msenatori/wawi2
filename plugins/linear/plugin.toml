# Linear para Wawi 2: un ejemplo y una plantilla de conector externo.
#
# No viene instalado. Para usarlo no hace falta copiar nada: decile a Wawi
# «conectá Linear» (o agregalo desde Ajustes). Wawi crea su carpeta en
# ~/.wawi2/plugins/linear a partir de este archivo, te abre Linear en el
# navegador y vos le das permiso. El permiso queda en el llavero de macOS.
#
# Los horarios y los textos de abajo son de la rutina del dueño (el equipo
# Life): en tu copia, cambialos cuando quieras. Wawi la lee al conectar.
#
# Si preferís una clave personal de API en lugar del login (avanzado),
# cambiá auth por:
#
#     auth = { clave = "LINEAR_API_KEY", ayuda = "https://linear.app/settings/account/security" }
#
# y Wawi te la pide en una ventanita segura. Se crea en Linear: Settings >
# Account > Security & access > Personal API keys.

description = "Tu rutina en Linear: el equipo Life, con una columna por día."
# Hasta 30 s por llamada; Linear a veces tarda.
timeout = "30s"
# Solo las herramientas de abajo llegan al cerebro: la lista queda corta.
expose = "listed"

# El login de Linear (OAuth): «Conectar» abre el navegador.
auth = "oauth"

[server]
url = "https://mcp.linear.app/mcp"

# Lectura: Wawi las usa sin preguntar, también por su cuenta.
[tools.list_issues]
kind = "read"
[tools.get_issue]
kind = "read"
[tools.list_issue_statuses]
kind = "read"
[tools.list_teams]
kind = "read"
[tools.list_projects]
kind = "read"
[tools.list_comments]
kind = "read"

# Acción: solo cuando se lo pedís, y siempre te pregunta antes.
# La descripción es lo que Wawi dice al pedir confirmación.
[tools.save_issue]
kind = "act"
confirm = true
description = "crear, editar o mover una tarea en Linear"
[tools.save_comment]
kind = "act"
confirm = true
description = "dejar un comentario en una tarea de Linear"

# Lunes a viernes a las 9: la columna de hoy del equipo Life.
# {dia_o_finde} es Lunes, Martes, Miércoles, Jueves, Viernes, o Finde el
# sábado y el domingo. Si la columna está vacía, Wawi no dice nada.
[[watch]]
name = "hoy"
at = "lun-vie 09:00"
tool = "list_issues"
args = { team = "Life", state = "{dia_o_finde}", limit = 30 }
say = "Son las tareas de hoy del dueño en Linear. Decile cuántas son y cuáles, en pocas palabras, sin leer los corchetes del proyecto salvo que ayuden. Después preguntale cuál es la tarea clave de hoy, y si no sabe, proponé una y decí por qué."
cooldown = "20h"

# El finde, más tarde y más corto.
[[watch]]
name = "finde"
at = "sab 10:30"
tool = "list_issues"
args = { team = "Life", state = "Finde", limit = 30 }
say = "Son las tareas del finde del dueño en Linear. Contale cuáles son en una o dos frases, sin apurarlo."
cooldown = "20h"

# Viernes a la tarde: el cierre de la semana.
[[routine]]
name = "cierre"
at = "vie 18:00"
prompt = "Es el cierre de semana del dueño. Mirá en Linear el equipo Life: lo que pasó a Done esta semana y lo que quedó en las columnas de los días. Contale en tres o cuatro frases qué salió y qué no, y preguntale si quiere mover algo a la semana que viene. No muevas nada vos: si hace falta, proponelo."
