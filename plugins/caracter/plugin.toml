# El carácter: Wawi aprende cómo le gusta a su dueño que le hable (el
# trato: estilo, no datos) y lo guarda en <home>/trato.md, que podés leer,
# editar o borrar. La referencia completa está en docs/PERSONALIDAD.md.
#
# Es un plugin de Wawi: viene con ella, apagado. Para prenderlo, decile
# «Wawi, conectá el carácter». Wawi copia esta carpeta a ~/.wawi2/plugins/caracter
# y lo arranca, sin reiniciar. Necesita su programa, `wawi-caracter`:
#   cargo build --release -p wawi-caracter     (queda junto a wawi2)
# o
#   cargo install --path crates/wawi-caracter --locked
#
# Wawi busca `wawi-caracter` primero junto a wawi2 (en la app, en
# Contents/MacOS) y después en el PATH. También podés poner el camino
# entero en command.

description = "El trato: cómo le gusta al dueño que Wawi le hable."
timeout = "10s"
expose = "listed"
# El aprendizaje viene APAGADO. Con false, Wawi igual sigue el trato.md que
# ya exista y contesta «¿cómo me tratás?», pero no aprende nada nuevo.
# Corré el banco (docs/PERSONALIDAD.md) y, si te convence, poné true.
observa_charla = false

[server]
command = "wawi-caracter"
args = ["mcp"]

[tools.trato]
kind = "read"
# Sacar una regla es deshacer algo tuyo: no pregunta. La iniciativa no puede.
[tools.quitar_regla]
kind = "act"
confirm = false
description = "sacar una regla del trato"
[tools.olvidar_trato]
kind = "act"
description = "borrar todo el trato aprendido"
